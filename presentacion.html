<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGD-Sentinel V2 · Avance 2 · Modelo Jerárquico Bayesiano</title>

  <!-- Tailwind CSS v4 (build para navegador, versión fijada) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4/dist/index.global.js"></script>

  <!-- React 18 + ReactDOM + Babel (JSX en el navegador) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <!-- Lucide Icons (build UMD para React; expone el global `LucideReact`).
       Su wrapper UMD busca el global `react` en minúscula, por eso se aliasa antes de cargarlo. -->
  <script>window.react = window.React;</script>
  <script crossorigin src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root { color-scheme: dark; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: #070b14;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .font-mono-sci { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace; }

    @keyframes inRight { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
    @keyframes inLeft  { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pop     { 0% { transform: scale(0); opacity: 0; } 65% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes growX   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulseRing { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.4); opacity: 0; } }

    .anim-in-right { animation: inRight .45s cubic-bezier(.22,.8,.3,1) both; }
    .anim-in-left  { animation: inLeft .45s cubic-bezier(.22,.8,.3,1) both; }
    .anim-fade-up  { animation: fadeUp .4s ease-out both; }
    .anim-pop      { animation: pop .6s cubic-bezier(.3,1.4,.5,1) both; transform-box: fill-box; transform-origin: center; }
    .anim-grow     { animation: growX .8s cubic-bezier(.22,.8,.3,1) both; transform-origin: left center; }
    .pulse-ring    { animation: pulseRing 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }

    /* Scrollbar discreto */
    .thin-scroll::-webkit-scrollbar { width: 8px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }

    /* Slider */
    input[type=range].sci-range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: #1e293b; outline: none; }
    input[type=range].sci-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #38bdf8; border: 3px solid #0b1220; box-shadow: 0 0 0 2px #38bdf8; cursor: pointer; }
    input[type=range].sci-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #38bdf8; border: 3px solid #0b1220; box-shadow: 0 0 0 2px #38bdf8; cursor: pointer; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-family:sans-serif">
      Cargando presentación…
    </div>
  </div>
  <noscript>Esta presentación requiere JavaScript.</noscript>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    /* =====================================================================
     * 0. UTILIDADES, CONSTANTES FÍSICAS Y TOKENS DE DISEÑO
     * ===================================================================== */

    // Íconos Lucide: si un nombre no existe en la versión cargada, no se rompe la UI.
    const Icon = ({ name, size = 18, className = '', ...rest }) => {
      const Cmp = window.LucideReact && window.LucideReact[name];
      return Cmp ? <Cmp size={size} className={className} aria-hidden="true" {...rest} /> : null;
    };

    // Talud infinito seco (mismos parámetros del informe).
    const GAMMA = 19.01;                     // kN/m³ (promedio de la base)
    const Z = 13;                            // m
    const BETA = (30 * Math.PI) / 180;       // rad
    const K_COH = GAMMA * Z * Math.sin(BETA) * Math.cos(BETA);   // denominador del término de cohesión
    const rad = (d) => (d * Math.PI) / 180;
    const termCohesion = (c) => c / K_COH;
    const termFriccion = (phiDeg) => Math.tan(rad(phiDeg)) / Math.tan(BETA);

    const PHI_PICO = 30.8;                   // Cortinas, t = 0
    const PHI_RESIDUAL = 21.3;               // Cortinas, t = 3.84
    const C_PICO = 18.5;
    const C_RESIDUAL = 12.1;

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const fmt = (v, d = 2) => Number(v).toFixed(d);

    // Interpolación lineal por tramos sobre pares [x, y].
    const interp = (pts, x) => {
      if (x <= pts[0][0]) return pts[0][1];
      for (let i = 1; i < pts.length; i++) {
        if (x <= pts[i][0]) {
          const [x0, y0] = pts[i - 1];
          const [x1, y1] = pts[i];
          return y0 + ((y1 - y0) * (x - x0)) / (x1 - x0);
        }
      }
      return pts[pts.length - 1][1];
    };

    // Φ(x) normal estándar (aprox. Abramowitz-Stegun 7.1.26).
    const normCdf = (x) => {
      const s = x < 0 ? -1 : 1;
      const a = Math.abs(x) / Math.SQRT2;
      const t = 1 / (1 + 0.3275911 * a);
      const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
      return 0.5 * (1 + s * y);
    };

    // Paleta sobria: azules, naranjas tenues y grises. Clases literales para que Tailwind las detecte.
    const TONES = {
      blue:   { text: 'text-sky-300',    soft: 'text-sky-200/80',   bg: 'bg-sky-400/10',    border: 'border-sky-400/30',    solid: 'bg-sky-400',    ring: 'ring-sky-400/40',    hex: '#38bdf8' },
      indigo: { text: 'text-blue-300',   soft: 'text-blue-200/80',  bg: 'bg-blue-400/10',   border: 'border-blue-400/30',   solid: 'bg-blue-400',   ring: 'ring-blue-400/40',   hex: '#60a5fa' },
      orange: { text: 'text-orange-300', soft: 'text-orange-200/80', bg: 'bg-orange-300/10', border: 'border-orange-300/30', solid: 'bg-orange-300', ring: 'ring-orange-300/40', hex: '#fdba74' },
      gray:   { text: 'text-slate-300',  soft: 'text-slate-400',    bg: 'bg-slate-400/10',  border: 'border-slate-500/40',  solid: 'bg-slate-400',  ring: 'ring-slate-400/40',  hex: '#94a3b8' },
      red:    { text: 'text-rose-300',   soft: 'text-rose-200/80',  bg: 'bg-rose-400/10',   border: 'border-rose-400/30',   solid: 'bg-rose-400',   ring: 'ring-rose-400/40',   hex: '#fb7185' },
      green:  { text: 'text-emerald-300', soft: 'text-emerald-200/80', bg: 'bg-emerald-400/10', border: 'border-emerald-400/30', solid: 'bg-emerald-400', ring: 'ring-emerald-400/40', hex: '#6ee7b7' },
    };

    /* =====================================================================
     * 1. COMPONENTES DE UI REUTILIZABLES
     * ===================================================================== */

    const Card = ({ className = '', children, tone = 'gray', ...rest }) => (
      <div className={`rounded-2xl border ${TONES[tone].border} bg-slate-900/60 backdrop-blur-sm ${className}`} {...rest}>
        {children}
      </div>
    );

    const Chip = ({ tone = 'blue', icon, children, className = '' }) => (
      <span className={`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-medium ${TONES[tone].border} ${TONES[tone].bg} ${TONES[tone].text} ${className}`}>
        {icon && <Icon name={icon} size={13} />}
        {children}
      </span>
    );

    const Stat = ({ value, label, tone = 'blue', sub, className = '' }) => (
      <Card tone={tone} className={`p-4 sm:p-5 ${className}`}>
        <div className={`font-mono-sci text-3xl sm:text-4xl font-bold leading-none ${TONES[tone].text}`}>{value}</div>
        <div className="mt-2 text-sm font-medium text-slate-200">{label}</div>
        {sub && <div className="mt-1 text-xs text-slate-500">{sub}</div>}
      </Card>
    );

    const Bullet = ({ icon = 'ChevronRight', tone = 'blue', children }) => (
      <li className="flex items-start gap-3 text-[15px] sm:text-base leading-snug text-slate-300">
        <span className={`mt-0.5 shrink-0 ${TONES[tone].text}`}><Icon name={icon} size={18} /></span>
        <span>{children}</span>
      </li>
    );

    const Eq = ({ children, tone = 'blue', className = '' }) => (
      <div className={`font-mono-sci rounded-xl border ${TONES[tone].border} bg-slate-950/70 px-4 py-3 text-[13px] sm:text-sm leading-relaxed ${TONES[tone].soft} overflow-x-auto thin-scroll ${className}`}>
        {children}
      </div>
    );

    const SegTabs = ({ options, value, onChange, tone = 'blue' }) => (
      <div role="tablist" className="inline-flex flex-wrap rounded-xl border border-slate-700/70 bg-slate-950/60 p-1 gap-1">
        {options.map((o) => {
          const active = o.id === value;
          return (
            <button
              key={o.id}
              role="tab"
              aria-selected={active}
              onClick={() => onChange(o.id)}
              className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs sm:text-sm font-medium transition-colors cursor-pointer ${
                active ? `${TONES[tone].bg} ${TONES[tone].text} ring-1 ${TONES[tone].ring}` : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              {o.icon && <Icon name={o.icon} size={14} />}
              {o.label}
            </button>
          );
        })}
      </div>
    );

    // Marco común de cada diapositiva: kicker + título + subtítulo + contenido.
    const SlideShell = ({ n, kicker, title, sub, children }) => (
      <div className="mx-auto flex min-h-full w-full max-w-6xl flex-col justify-center px-5 py-6 sm:px-10 sm:py-8">
        <div className="mb-5 sm:mb-7">
          <div className="mb-2 flex flex-wrap items-center gap-2">
            <span className="font-mono-sci text-xs tracking-widest text-orange-300/90">{String(n).padStart(2, '0')}</span>
            <span className="h-px w-8 bg-slate-700" />
            <span className="text-xs font-semibold uppercase tracking-[0.18em] text-sky-300/90">{kicker}</span>
          </div>
          <h2 className="text-2xl font-bold leading-tight tracking-tight text-slate-50 sm:text-4xl">{title}</h2>
          {sub && <p className="mt-2 max-w-3xl text-sm text-slate-400 sm:text-base">{sub}</p>}
        </div>
        {children}
      </div>
    );

    /* =====================================================================
     * 2. DIAPOSITIVAS
     * ===================================================================== */

    /* ---------- 01 · Portada ---------- */
    const SlideCover = () => (
      <div className="relative mx-auto flex min-h-full w-full max-w-6xl flex-col justify-center px-5 py-8 sm:px-10">
        {/* Motivo decorativo: recta de deterioro con cono de incertidumbre */}
        <svg className="pointer-events-none absolute inset-0 h-full w-full opacity-60" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="coverCone" x1="0" x2="1">
              <stop offset="0" stopColor="#fdba74" stopOpacity="0.20" />
              <stop offset="1" stopColor="#38bdf8" stopOpacity="0.04" />
            </linearGradient>
          </defs>
          <polygon points="0,250 1000,420 1000,600 0,330" fill="url(#coverCone)" transform="translate(0,-40)" />
          <line x1="0" y1="250" x2="1000" y2="510" stroke="#fdba74" strokeOpacity="0.45" strokeWidth="2" strokeDasharray="6 8" transform="translate(0,-40)" />
          {[...Array(27)].map((_, i) => (
            <circle key={i} cx={60 + i * 35} cy={140 + ((i * 53) % 90) + i * 4} r="3" fill="#38bdf8" fillOpacity="0.35" />
          ))}
        </svg>

        <div className="relative anim-fade-up">
          <div className="mb-4 flex flex-wrap gap-2">
            <Chip tone="orange" icon="FlaskConical">Avance 2 · Proyecto final</Chip>
            <Chip tone="blue" icon="Sigma">Inferencia Bayesiana</Chip>
          </div>
          <h1 className="max-w-4xl text-3xl font-extrabold leading-[1.1] tracking-tight text-slate-50 sm:text-5xl lg:text-6xl">
            Del talud único a la <span className="text-sky-300">región</span>:
            <br />
            <span className="text-orange-300">modelo jerárquico</span> de deterioro geotécnico
          </h1>
          <p className="mt-5 max-w-2xl text-base text-slate-400 sm:text-lg">
            AGD-Sentinel V2 · Pérdida de cohesión en taludes coluviales de Toledo, Norte de Santander
          </p>

          <div className="mt-8 grid max-w-2xl grid-cols-3 gap-3">
            <Stat value="48" label="observaciones" tone="blue" />
            <Stat value="27" label="taludes" tone="indigo" />
            <Stat value="1" label="tasa regional δ" tone="orange" />
          </div>

          <div className="mt-8 flex flex-col gap-4 border-t border-slate-800 pt-5 text-sm text-slate-400 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <div className="font-medium text-slate-200">Santiago Sepúlveda · Juan José Rangel · Mateo Bazán</div>
              <div className="mt-0.5 text-xs text-slate-500">Cód. 2243557 · 2243554 · 2243590</div>
            </div>
            <div className="sm:text-right">
              <div>Prof. David Romo Bucheli, PhD</div>
              <div className="text-xs text-slate-500">28 de octubre de 2026</div>
            </div>
          </div>
        </div>
      </div>
    );

    /* ---------- 02 · Problema ---------- */
    const SlideProblema = () => (
      <SlideShell n={2} kicker="El problema" title="Los taludes pierden resistencia. ¿A qué ritmo y con cuánta incertidumbre?">
        <div className="grid gap-5 lg:grid-cols-5">
          <div className="space-y-4 lg:col-span-2">
            <Card tone="orange" className="p-5">
              <div className="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-orange-300">
                <Icon name="TrendingDown" size={15} /> Deterioro Geotécnico Acumulado
              </div>
              <div className="font-mono-sci text-2xl font-bold text-slate-50 sm:text-3xl">
                c<sub className="text-base">i</sub>(t) = <span className="text-sky-300">α<sub className="text-base">i</sub></span> − <span className="text-orange-300">δ</span>·t
              </div>
              <ul className="mt-4 space-y-1.5 text-sm text-slate-400">
                <li><span className="font-mono-sci text-sky-300">αᵢ</span> · cohesión inicial del talud i</li>
                <li><span className="font-mono-sci text-orange-300">δ</span> · tasa de pérdida (kPa/año)</li>
                <li className="text-slate-500">Luego c → FoS vía talud infinito (Skempton y DeLory, 1957)</li>
              </ul>
            </Card>
            <Card className="p-5">
              <div className="text-sm text-slate-400">Contexto</div>
              <ul className="mt-2 space-y-2">
                <Bullet icon="MapPin" tone="blue">Suelos coluviales · región de Toledo</Bullet>
                <Bullet icon="Database" tone="blue">Ensayos de corte directo y SPT</Bullet>
                <Bullet icon="Mountain" tone="orange">Sitio estrella: <b className="text-slate-100">Cortinas</b>, con falla observada</Bullet>
              </ul>
            </Card>
          </div>

          <div className="space-y-3 lg:col-span-3">
            <div className="text-xs font-semibold uppercase tracking-widest text-slate-500">Tres objetivos inferenciales</div>
            {[
              { n: 'i', icon: 'Target', tone: 'blue', t: 'Estimar', d: 'Tasa de pérdida δ y cohesión inicial αᵢ de cada talud, con su incertidumbre.' },
              { n: 'ii', icon: 'Activity', tone: 'indigo', t: 'Predecir', d: 'Cohesión y P(FoS < 1) entre 0 y 8 años.' },
              { n: 'iii', icon: 'ShieldCheck', tone: 'orange', t: 'Contrastar', d: '¿Cortinas sigue la recta decreciente tras la falla… o recupera resistencia (p. ej. succión)?' },
            ].map((o) => (
              <Card key={o.n} tone={o.tone} className="flex items-start gap-4 p-4 sm:p-5">
                <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${TONES[o.tone].bg} ${TONES[o.tone].text}`}>
                  <Icon name={o.icon} size={22} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-mono-sci text-xs text-slate-500">({o.n})</span>
                    <span className={`text-lg font-semibold ${TONES[o.tone].text}`}>{o.t}</span>
                  </div>
                  <p className="mt-0.5 text-[15px] text-slate-300">{o.d}</p>
                </div>
              </Card>
            ))}
          </div>
        </div>
      </SlideShell>
    );

    /* ---------- 03 · Box's Loop ---------- */
    const BOX_STEPS = [
      {
        id: 'proponer', icon: 'Lightbulb', tone: 'blue', label: 'Proponer', tag: 'Avance 1',
        head: 'Bayes empírico simple, un solo sitio',
        items: ['Normal multivariada para (c₀, φ₀), ρ = −0.62', 'Tasas individuales α y δ (Lognormal)', 'Verosimilitud gaussiana con 2 datos en t = 4'],
      },
      {
        id: 'ajustar', icon: 'Cpu', tone: 'indigo', label: 'Ajustar', tag: 'Datos + NUTS',
        head: 'Ampliar a la región y correr el muestreador',
        items: ['Base maestra: 48 obs. de 27 sitios', 'Corrida preliminar NUTS (PyMC v5)', '0 divergencias · R̂ = 1.00'],
      },
      {
        id: 'criticar', icon: 'Search', tone: 'orange', label: 'Criticar', tag: '3 preguntas',
        head: 'Los datos objetan el modelo',
        items: ['26 de 27 sitios con un solo instante (Small Data)', 'Cohesiones ≈ 0 kPa vs. Normal sin límites', 'La fricción domina el FoS (86 % de la caída)'],
      },
      {
        id: 'replantear', icon: 'Repeat', tone: 'green', label: 'Replantear', tag: 'Avance 2',
        head: 'Modelo jerárquico regional',
        items: ['δ regional compartido + αᵢ por sitio (pooling parcial)', 'Normal truncada en 0', 'Fricción en 2 escenarios fijos'],
      },
    ];

    const SlideBox = () => {
      const [active, setActive] = useState(2);
      const step = BOX_STEPS[active];
      const t = TONES[step.tone];
      return (
        <SlideShell n={3} kicker="Flujo de trabajo bayesiano" title="El ciclo de Box: criticar el modelo es parte del modelo"
          sub="Toca cada etapa para ver qué hicimos en este proyecto.">
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
            {BOX_STEPS.map((s, i) => {
              const on = i === active;
              return (
                <button key={s.id} onClick={() => setActive(i)}
                  className={`group relative rounded-2xl border p-4 text-left transition-all cursor-pointer ${
                    on ? `${TONES[s.tone].border} ${TONES[s.tone].bg} ring-1 ${TONES[s.tone].ring}` : 'border-slate-800 bg-slate-900/50 hover:border-slate-600'
                  }`}>
                  <div className="flex items-center justify-between">
                    <span className={on ? TONES[s.tone].text : 'text-slate-500'}><Icon name={s.icon} size={22} /></span>
                    <span className="font-mono-sci text-[11px] text-slate-500">{i + 1}/4</span>
                  </div>
                  <div className={`mt-3 text-lg font-semibold ${on ? TONES[s.tone].text : 'text-slate-300'}`}>{s.label}</div>
                  <div className="text-xs text-slate-500">{s.tag}</div>
                  {i < 3 && <span className="absolute -right-3.5 top-1/2 z-10 hidden -translate-y-1/2 text-slate-600 sm:block"><Icon name="ArrowRight" size={18} /></span>}
                </button>
              );
            })}
          </div>

          <div className="mt-2 hidden items-center gap-2 pl-2 text-xs text-slate-500 sm:flex">
            <Icon name="CornerDownLeft" size={14} /> el ciclo vuelve a empezar con el modelo replanteado
          </div>

          <Card key={step.id} tone={step.tone} className="anim-fade-up mt-4 p-5 sm:p-6">
            <div className="flex flex-wrap items-center gap-3">
              <span className={`flex h-10 w-10 items-center justify-center rounded-xl ${t.bg} ${t.text}`}><Icon name={step.icon} size={20} /></span>
              <div>
                <div className={`text-xs font-semibold uppercase tracking-widest ${t.text}`}>{step.label}</div>
                <div className="text-lg font-semibold text-slate-50 sm:text-xl">{step.head}</div>
              </div>
            </div>
            <ul className="mt-4 grid gap-2.5 sm:grid-cols-3">
              {step.items.map((it) => (
                <li key={it} className={`rounded-xl border ${t.border} bg-slate-950/50 p-3 text-sm text-slate-300`}>{it}</li>
              ))}
            </ul>
          </Card>

          <div className="mt-4 flex flex-wrap gap-2">
            <Chip tone="gray" icon="Clock">Siguiente vuelta: prior predictive checks · sensibilidad a priors · comparación de modelos</Chip>
          </div>
        </SlideShell>
      );
    };

    /* ---------- 04 · Datos ---------- */
    const SlideDatos = () => {
      const rows = [
        { label: 'Fuentes unidas', total: 57, train: 0, val: 0, note: '4 + 38 + 15', tone: 'gray' },
        { label: 'Tras depurar', total: 50, train: 0, val: 0, note: '−7 sin c, φ o fecha', tone: 'indigo' },
        { label: 'Base final', total: 50, train: 48, val: 2, note: '48 + 2', tone: 'blue' },
      ];
      return (
        <SlideShell n={4} kicker="Construcción de la base" title="De 57 filas crudas a 48 + 2 observaciones limpias"

                <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-sky-400" /> Entrenamiento (27 sitios)</span>
                <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-rose-400" /> Validación: Cortinas t = 5.84 y 7.84</span>
              </div>

            <div className="space-y-3 lg:col-span-2">
              <div className="text-xs font-semibold uppercase tracking-widest text-slate-500">Decisiones de curaduría</div>

                { icon: 'Layers', tone: 'blue', t: '30 → 27 sitios', d: 'Estratos de Río Negro agrupados por sondeo (R-01…R-03).' },
                { icon: 'Filter', tone: 'orange', t: '3 ceros → ε = 0.1 kPa', d: 'Evita ln 0; efecto práctico nulo.' },
                { icon: 'Calendar', tone: 'indigo', t: 't = 0 el 1-mar-2017', d: 'Referencia común de todos los sitios.' },
                { icon: 'Scale', tone: 'gray', t: 'γ = 19.01 kN/m³', d: 'Promedio regional (16 celdas vacías), no medición de Cortinas.' },
              ].map((c) => (
                <Card key={c.t} tone={c.tone} className="flex items-start gap-3 p-3.5">
                  <span className={`mt-0.5 ${TONES[c.tone].text}`}><Icon name={c.icon} size={20} /></span>
                  <div>
                    <div className={`text-sm font-semibold ${TONES[c.tone].text}`}>{c.t}</div>

    /* ---------- 05 · Small Data (Pregunta 1) ---------- */
    const SlideSmallData = () => {
      const [view, setView] = useState('sitios');
      const dataSitios = [
        { k: '1 registro', v: 17, tone: 'orange' },
        { k: '2 registros', v: 8, tone: 'indigo' },
        { k: '4 registros', v: 1, tone: 'blue' },
        { k: '11 registros', v: 1, tone: 'blue' },
      ];
      const dataT = [
        { k: 't = 0 (referencia)', v: 27, tone: 'orange' },
        { k: 't > 0', v: 21, tone: 'blue' },
      ];
      const data = view === 'sitios' ? dataSitios : dataT;
      const max = view === 'sitios' ? 17 : 27;
      const unit = view === 'sitios' ? 'sitios' : 'observaciones';
      return (
        <SlideShell n={5} kicker="Pregunta 1 · ¿Hay información longitudinal?" title="Small Data: 26 de 27 taludes tienen un solo instante en el tiempo"
          sub="Contar tiempos, no solo observaciones, es lo que revela el problema de identificabilidad.">
          <div className="grid gap-5 lg:grid-cols-5">
            <Card className="p-5 lg:col-span-3">
              <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
                <SegTabs value={view} onChange={setView}
                  options={[{ id: 'sitios', label: 'Registros por sitio', icon: 'BarChart3' }, { id: 'tiempo', label: 'Observaciones por instante', icon: 'Clock' }]} />

              </div>
              <div className="space-y-3.5" key={view}>

                  <div key={d.k} className="flex items-center gap-3">
                    <div className="w-32 shrink-0 text-sm text-slate-300 sm:w-40">{d.k}</div>
                    <div className="h-8 flex-1 overflow-hidden rounded-md bg-slate-800/60">
                      <div className="anim-grow flex h-full items-center justify-end pr-2 text-sm font-bold text-slate-950"
                        style={{ width: `${Math.max((d.v / max) * 100, 7)}%`, background: TONES[d.tone].hex, animationDelay: `${i * 0.1}s` }}>
                        {d.v}

              </div>
              <p className="mt-4 text-sm text-slate-500">
                {view === 'sitios'

            </Card>

            <div className="space-y-3 lg:col-span-2">
              <Card tone="orange" className="p-5">
                <div className="flex items-center gap-2 text-orange-300"><Icon name="AlertTriangle" size={18} /><span className="text-sm font-semibold">Identificabilidad</span></div>
                <Eq tone="orange" className="mt-3">una medición ⇒ solo αᵢ − δᵢ·t<br />¿cuánto es αᵢ y cuánto δᵢ?  <span className="text-rose-300">✗</span></Eq>
              </Card>
              <Card tone="blue" className="p-5">
                <div className="text-sm text-slate-400">Única caída observada · Cortinas</div>
                <div className="mt-2 flex items-baseline gap-2 font-mono-sci">
                  <span className="text-2xl font-bold text-sky-300">18.5</span>
                  <Icon name="ArrowRight" size={16} className="text-slate-500" />
                  <span className="text-2xl font-bold text-orange-300">12.1</span>
                  <span className="text-xs text-slate-500">kPa</span>
                </div>
                <div className="mt-1 text-sm text-slate-400">≈ <b className="text-slate-100">1.67 kPa/año</b> · 2 puntos, sin medida del error</div>
              </Card>
              <Card tone="green" className="p-4">
                <div className="flex items-start gap-2 text-sm text-slate-300">
                  <span className="mt-0.5 text-emerald-300"><Icon name="CheckCircle2" size={18} /></span>
