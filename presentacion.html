      );
    };

    /* ---------- 06 · Salto metodológico (Toggle) ---------- */
    // Posiciones de los 27 nodos (2 anillos). Cortinas = índice 0.
    const NODES = (() => {
      const out = [];
      const outer = 18, inner = 9;
      for (let i = 0; i < outer; i++) {
        const a = (i / outer) * 2 * Math.PI - Math.PI / 2;
        out.push({ x: 50 + 42 * Math.cos(a), y: 50 + 42 * Math.sin(a) });
      }
      for (let i = 0; i < inner; i++) {
        const a = (i / inner) * 2 * Math.PI - Math.PI / 2 + 0.3;
        out.push({ x: 50 + 24 * Math.cos(a), y: 50 + 24 * Math.sin(a) });
      }
      // Cortinas pasa a ser el nodo superior del anillo exterior.
      return out;
    })();

    const SlideSalto = () => {
      const [regional, setRegional] = useState(false);
      const compare = regional
        ? [
            ['Sitios', '27', 'blue'], ['Observaciones', '48 (+2 validación)', 'blue'], ['Tasa de pérdida', '1 compartida: δ_región', 'orange'],
            ['Cohesión inicial', '27 valores αᵢ (jerárquicos)', 'blue'], ['Verosimilitud', 'Normal truncada en 0', 'green'],
          ]
        : [
            ['Sitios', '1 (Cortinas)', 'gray'], ['Observaciones', '4 aisladas', 'gray'], ['Tasa de pérdida', '2 individuales: α (c) y δ (φ)', 'gray'],
            ['Cohesión inicial', 'c₀ ~ Normal multivariada con φ₀', 'gray'], ['Verosimilitud', 'Gaussiana, 2 datos en t = 4', 'gray'],
          ];
      return (
        <SlideShell n={6} kicker="El salto metodológico" title="Del Avance 1 al Avance 2: cómo se superó el Small Data"
          sub="Activa el interruptor para pasar de un modelo de sitio único al modelo jerárquico regional.">
          {/* Toggle */}
          <div className="mb-5 flex flex-wrap items-center gap-3">
            <button onClick={() => setRegional(false)} className={`text-sm font-medium transition-colors cursor-pointer ${!regional ? 'text-slate-100' : 'text-slate-500'}`}>
              Modelo Bayesiano Simple <span className="text-slate-500">(1 sitio)</span>
            </button>
            <button role="switch" aria-checked={regional} aria-label="Cambiar entre modelo simple y jerárquico" onClick={() => setRegional((v) => !v)}
              className={`relative h-8 w-16 shrink-0 rounded-full border transition-colors cursor-pointer ${regional ? 'border-orange-300/50 bg-orange-300/20' : 'border-sky-400/40 bg-sky-400/15'}`}>
              <span className={`absolute top-1 h-6 w-6 rounded-full transition-all duration-300 ${regional ? 'left-9 bg-orange-300' : 'left-1 bg-sky-400'}`} />
            </button>
            <button onClick={() => setRegional(true)} className={`text-sm font-medium transition-colors cursor-pointer ${regional ? 'text-slate-100' : 'text-slate-500'}`}>
              Modelo Jerárquico Regional <span className="text-slate-500">(27 sitios)</span>
            </button>
          </div>

          <div className="grid items-center gap-5 lg:grid-cols-2">
            {/* Visual */}
            <Card tone={regional ? 'orange' : 'blue'} className="relative mx-auto aspect-square overflow-hidden p-2" style={{ width: 'min(100%, 28rem, 52vh)' }}>
              <svg className="absolute inset-0 h-full w-full" viewBox="0 0 100 100" aria-hidden="true">
                {NODES.map((n, i) => (
                  <line key={i} x1="50" y1="50" x2={n.x} y2={n.y} stroke={i === 0 ? '#fdba74' : '#38bdf8'} strokeWidth="0.35"
                    style={{ opacity: regional ? 0.35 : 0, transition: 'opacity .6s ease', transitionDelay: regional ? `${i * 15}ms` : '0ms' }} />
                ))}
              </svg>

              {/* Hub regional */}
              <div className="absolute flex items-center justify-center rounded-full border border-orange-300/60 bg-orange-300/15 text-center font-mono-sci text-orange-200 transition-all duration-500"
                style={{ left: '50%', top: '50%', width: '17%', height: '17%', transform: `translate(-50%,-50%) scale(${regional ? 1 : 0})`, opacity: regional ? 1 : 0, fontSize: 'clamp(9px,1.6vw,13px)' }}>
                δ<sub>reg</sub>
              </div>

              {NODES.map((n, i) => {
                const isC = i === 0;
                const left = regional ? n.x : 50;
                const top = regional ? n.y : 50;
                const visible = regional || isC;
                const size = !regional && isC ? 26 : 5.5;
                return (
                  <div key={i}
                    className={`absolute rounded-full border ${isC ? 'border-orange-200 bg-orange-300' : 'border-sky-300/70 bg-sky-400/70'}`}
                    style={{
                      left: `${left}%`, top: `${top}%`, width: `${size}%`, height: `${size}%`,
                      transform: 'translate(-50%,-50%)', opacity: visible ? 1 : 0,
                      transition: 'all .7s cubic-bezier(.22,.8,.3,1)', transitionDelay: regional ? `${i * 15}ms` : '0ms',
                      zIndex: isC ? 5 : 1,
                    }}>
                    {!regional && isC && (
                      <span className="absolute inset-0 flex items-center justify-center text-center font-semibold text-slate-950" style={{ fontSize: 'clamp(9px,1.7vw,13px)' }}>Cortinas</span>
                    )}
                  </div>
                );
              })}

              <div className="absolute bottom-2 left-3 right-3 flex items-center justify-between text-[11px] text-slate-500">
                <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-orange-300" /> Cortinas</span>
                <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-sky-400" /> otros taludes</span>
              </div>
            </Card>

            {/* Comparativa */}
            <div>
              <div className={`mb-3 flex items-center gap-2 text-sm font-semibold ${regional ? 'text-emerald-300' : 'text-rose-300'}`}>
                <Icon name={regional ? 'CheckCircle2' : 'AlertTriangle'} size={18} />
                {regional ? 'Pooling parcial: la tasa se informa con toda la región' : 'Small Data: sin series, sin tasas propias por sitio'}
              </div>
              <div className="space-y-2" key={String(regional)}>
                {compare.map(([k, v, tone], i) => (
                  <div key={k} className="anim-fade-up flex items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/60 px-4 py-2.5" style={{ animationDelay: `${i * 60}ms` }}>
                    <span className="text-sm text-slate-400">{k}</span>
                    <span className={`text-right text-sm font-semibold ${TONES[tone].text}`}>{v}</span>
                  </div>
                ))}
              </div>
              <p className="mt-3 text-sm text-slate-500">
                {regional
                  ? 'Un talud con una medición se “jala” hacia la media regional; uno con más datos se aleja de ella.'
                  : 'Notación: c₀ → αᵢ y α → δ_región; φ deja de degradarse dentro del modelo.'}
              </p>
            </div>
          </div>
        </SlideShell>
      );
    };

    /* ---------- 07 · Normal truncada (Pregunta 2) ---------- */
    const SlideTruncada = () => {
      const [truncada, setTruncada] = useState(false);
      const M = 14.6, S = 7.8;
      const pNeg = normCdf((0 - M) / S);        // ≈ 0.031
      const W = 600, H = 250, pad = { l: 30, r: 14, t: 12, b: 32 };
      const xMin = -12, xMax = 40, yMax = 0.058;
      const X = (v) => pad.l + ((v - xMin) / (xMax - xMin)) * (W - pad.l - pad.r);
      const Y = (v) => pad.t + (1 - v / yMax) * (H - pad.t - pad.b);
      const pdf = (x) => Math.exp(-0.5 * ((x - M) / S) ** 2) / (S * Math.sqrt(2 * Math.PI));
      const xs = useMemo(() => Array.from({ length: 261 }, (_, i) => xMin + (i / 260) * (xMax - xMin)), []);
      const curve = (arr, scale = 1) => arr.map((x) => `${X(x).toFixed(1)},${Y(pdf(x) * scale).toFixed(1)}`).join(' ');
      const negXs = xs.filter((x) => x <= 0);
      const posXs = xs.filter((x) => x >= 0);
      const negArea = `${X(xMin)},${Y(0)} ${curve(negXs)} ${X(0)},${Y(0)}`;
      const scale = 1 / (1 - pNeg);
      const fillPos = `${X(0)},${Y(0)} ${curve(posXs, truncada ? scale : 1)} ${X(xMax)},${Y(0)}`;
      const dots = [0.1, 0.1, 0.1, 0.72];

      return (
        <SlideShell n={7} kicker="Pregunta 2 · ¿Cohesión ≈ 0 rompe la Normal?" title="La Normal admite cohesión negativa. La física no."
          sub="Alterna la verosimilitud y observa dónde va a parar la masa de probabilidad.">
          <div className="grid gap-5 lg:grid-cols-5">
            <Card className="p-4 sm:p-5 lg:col-span-3">
              <div className="mb-3 flex flex-wrap items-center justify-between gap-3">
                <SegTabs tone={truncada ? 'orange' : 'blue'} value={truncada ? 'T' : 'N'} onChange={(v) => setTruncada(v === 'T')}
                  options={[{ id: 'N', label: 'Normal (Avance 1)', icon: 'Activity' }, { id: 'T', label: 'Normal truncada en 0', icon: 'Scissors' }]} />
                <span className="font-mono-sci text-xs text-slate-500">μ = 14.6 · σ = 7.8 kPa</span>
              </div>
              <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Densidad normal ajustada a la cohesión con la zona negativa sombreada">
                {/* ejes */}
                <line x1={pad.l} y1={Y(0)} x2={W - pad.r} y2={Y(0)} stroke="#334155" />
                {[-10, 0, 10, 20, 30, 40].map((v) => (
                  <g key={v}>
                    <line x1={X(v)} y1={Y(0)} x2={X(v)} y2={Y(0) + 5} stroke="#475569" />
                    <text x={X(v)} y={Y(0) + 20} textAnchor="middle" fontSize="12" fill="#64748b">{v}</text>
                  </g>
                ))}
                <text x={W - pad.r} y={H - 2} textAnchor="end" fontSize="12" fill="#64748b">cohesión c (kPa)</text>
                {/* zona prohibida */}
                <rect x={X(xMin)} y={pad.t} width={X(0) - X(xMin)} height={Y(0) - pad.t} fill="#fb7185" fillOpacity="0.06" />
                <line x1={X(0)} y1={pad.t} x2={X(0)} y2={Y(0)} stroke="#fb7185" strokeDasharray="4 4" strokeOpacity="0.8" />
                <text x={X(0) - 8} y={pad.t + 14} textAnchor="end" fontSize="12" fill="#fb7185">c &lt; 0 imposible</text>
                {/* masa negativa */}
                <polygon points={negArea} fill="#fb7185" fillOpacity={truncada ? 0 : 0.55} style={{ transition: 'fill-opacity .5s' }} />
                {/* densidad positiva */}
                <polygon points={fillPos} fill={truncada ? '#fdba74' : '#38bdf8'} fillOpacity="0.22" style={{ transition: 'fill .5s' }} />
                <polyline points={curve(posXs, truncada ? scale : 1)} fill="none" stroke={truncada ? '#fdba74' : '#38bdf8'} strokeWidth="2.5" />
                <polyline points={curve(negXs)} fill="none" stroke="#38bdf8" strokeWidth="2" strokeOpacity={truncada ? 0 : 1} strokeDasharray={truncada ? '0' : '0'} style={{ transition: 'stroke-opacity .5s' }} />
                {/* observaciones < 1 kPa */}
                {dots.map((d, i) => (
                  <circle key={i} cx={X(d)} cy={Y(0) - 7 - i * 9} r="4.5" fill="#f8fafc" stroke="#0f172a" strokeWidth="1.5" />
                ))}
                <text x={X(1.8)} y={Y(0) - 12} fontSize="11" fill="#cbd5e1" textAnchor="start">← 4 obs. &lt; 1 kPa</text>
                {/* etiqueta masa */}
                <g style={{ opacity: truncada ? 0 : 1, transition: 'opacity .4s' }}>
                  <text x={X(-6)} y={Y(0) - 40} textAnchor="middle" fontSize="15" fontWeight="700" fill="#fb7185">{(pNeg * 100).toFixed(1)} %</text>
                  <text x={X(-6)} y={Y(0) - 24} textAnchor="middle" fontSize="11" fill="#fb7185">masa negativa</text>
                </g>
                <g style={{ opacity: truncada ? 1 : 0, transition: 'opacity .4s' }}>
                  <text x={X(-6)} y={Y(0) - 32} textAnchor="middle" fontSize="13" fontWeight="600" fill="#6ee7b7">0 % negativa</text>
                  <text x={X(-6)} y={Y(0) - 18} textAnchor="middle" fontSize="11" fill="#6ee7b7">renormalizada</text>
                </g>
              </svg>
            </Card>

            <div className="space-y-3 lg:col-span-2">
              <div className="grid grid-cols-2 gap-3">
                <Stat value="8.3 %" label="obs. < 1 kPa" sub="4 de 48 · todas Río Negro" tone="orange" />
                <Stat value="3.1 %" label="masa < 0 (global)" sub="~1.5 obs. de 48" tone="red" />
              </div>
              <Card className="p-4">
                <ul className="space-y-2.5">
                  <Bullet icon="Minus" tone="red">En R-02, una Normal pondría ≈ <b className="text-slate-100">50 %</b> de su masa bajo cero.</Bullet>
                  <Bullet icon="TrendingDown" tone="orange">Con la tasa de Cortinas, la recta toca c = 0 hacia los <b className="text-slate-100">~11 años</b>.</Bullet>
                  <Bullet icon="HelpCircle" tone="blue">Esos ceros provienen de interceptos de regresión SPT: ¿reales?</Bullet>
                </ul>
              </Card>
              <Card tone="green" className="p-4">
                <div className="text-xs font-semibold uppercase tracking-widest text-emerald-300">Decisión</div>
                <Eq tone="green" className="mt-2">c_obs ~ TruncatedNormal(μ, σ_obs, lower = 0)</Eq>
              </Card>
            </div>
          </div>
        </SlideShell>
      );
    };
    /* ---------- 08 · Sensibilidad del FoS (Pregunta 3) ---------- */
    const SlideFoS = () => {
      const [p, setP] = useState(100);              // 0..100 % del camino entre t = 0 y t = 3.84
      const [mode, setMode] = useState('ambos');    // ambos | cohesion | friccion
      const f = p / 100;
      const c = mode === 'friccion' ? C_PICO : C_PICO + (C_RESIDUAL - C_PICO) * f;
      const phi = mode === 'cohesion' ? PHI_PICO : PHI_PICO + (PHI_RESIDUAL - PHI_PICO) * f;
      const tc = termCohesion(c);
      const tf = termFriccion(phi);
      const fos = tc + tf;
      const SCALE = 1.4;
      const failed = fos < 1;

      // Atribución exacta a partir de la ecuación del talud infinito.
      const dC = termCohesion(C_PICO) - termCohesion(C_RESIDUAL);
      const dF = termFriccion(PHI_PICO) - termFriccion(PHI_RESIDUAL);
      const dTot = dC + dF;
      const shareF = Math.round((dF / dTot) * 100);
      const shareC = 100 - shareF;

      const finals = [
        { id: 'ambos', label: 'Ambos se degradan', val: termCohesion(C_RESIDUAL) + termFriccion(PHI_RESIDUAL), tone: 'orange' },
        { id: 'cohesion', label: 'Solo cohesión cae', val: termCohesion(C_RESIDUAL) + termFriccion(PHI_PICO), tone: 'blue' },
        { id: 'friccion', label: 'Solo fricción cae', val: termCohesion(C_PICO) + termFriccion(PHI_RESIDUAL), tone: 'red' },
      ];

      return (
        <SlideShell n={8} kicker="Pregunta 3 · ¿Quién domina el FoS?" title="La fricción explica el 86 % de la caída del FoS en Cortinas">
          <div className="grid gap-5 lg:grid-cols-5">
            {/* Simulador */}
            <Card className="p-4 sm:p-5 lg:col-span-3">
              <div className="mb-1 flex items-center justify-between">
                <div className="text-xs font-semibold uppercase tracking-widest text-slate-500">Simulador · talud infinito</div>
                <Chip tone={failed ? 'red' : 'green'} icon={failed ? 'AlertTriangle' : 'ShieldCheck'}>{failed ? 'FoS < 1 · inestable' : 'FoS ≥ 1 · estable'}</Chip>
              </div>

              <div className="mt-3 grid grid-cols-2 gap-2.5 text-sm">
                <div className="rounded-xl border border-sky-400/30 bg-sky-400/10 p-3">
                  <div className="text-xs text-slate-400">Cohesión c</div>
                  <div className="font-mono-sci text-xl font-bold text-sky-300">{fmt(c, 1)} <span className="text-xs font-normal text-slate-500">kPa</span></div>
                </div>
                <div className="rounded-xl border border-orange-300/30 bg-orange-300/10 p-3">
                  <div className="text-xs text-slate-400">Fricción φ</div>
                  <div className="font-mono-sci text-xl font-bold text-orange-300">{fmt(phi, 1)}<span className="text-xs font-normal text-slate-500"> °</span></div>
                </div>
              </div>

              <div className="mt-4">
                <div className="mb-2 flex justify-between text-xs text-slate-500">
                  <span>2017 · t = 0 (pico)</span><span className="font-mono-sci text-slate-300">{fmt(f * 3.84, 2)} años</span><span>2021 · t = 3.84 (falla)</span>
                </div>
                <input type="range" min="0" max="100" value={p} onChange={(e) => setP(Number(e.target.value))} className="sci-range" aria-label="Progreso del deterioro entre t = 0 y t = 3.84" />
              </div>

              {/* Barra proporcional FoS */}
              <div className="mt-4">
                <div className="relative h-12 w-full overflow-hidden rounded-xl bg-slate-800/60">
                  <div className="absolute inset-y-0 left-0 flex items-center justify-center text-xs font-bold text-slate-950 transition-all duration-200"
                    style={{ width: `${(tf / SCALE) * 100}%`, background: TONES.orange.hex }}>
                    {tf / SCALE > 0.18 ? `φ · ${fmt(tf)}` : ''}
                  </div>
                  <div className="absolute inset-y-0 flex items-center justify-center text-xs font-bold text-slate-950 transition-all duration-200"
                    style={{ left: `${(tf / SCALE) * 100}%`, width: `${(tc / SCALE) * 100}%`, background: TONES.blue.hex }}>
                    {tc / SCALE > 0.07 ? `c · ${fmt(tc)}` : ''}
                  </div>
                  <div className="absolute inset-y-0 w-0.5 bg-rose-400" style={{ left: `${(1 / SCALE) * 100}%` }} />
                </div>
                <div className="relative mt-1 h-5 text-[11px]">
                  <span className="absolute -translate-x-1/2 text-rose-300" style={{ left: `${(1 / SCALE) * 100}%` }}>FoS = 1</span>
                  <span className="absolute left-0 text-slate-600">0</span>
                  <span className="absolute right-0 text-slate-600">{SCALE}</span>
                </div>
                <div className="mt-2 flex items-end justify-between">
                  <div className="flex gap-4 text-xs text-slate-400">
                    <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-orange-300" /> término de fricción</span>
                    <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-sky-400" /> término de cohesión</span>
                  </div>
                  <div className={`font-mono-sci text-3xl font-bold ${failed ? 'text-rose-300' : 'text-emerald-300'}`}>FoS = {fmt(fos)}</div>
                </div>
              </div>

              {/* Contrafactuales */}
              <div className="mt-3 grid grid-cols-3 gap-2">
                {finals.map((o) => {
                  const on = mode === o.id;
                  return (
                    <button key={o.id} onClick={() => { setMode(o.id); setP(100); }}
                      className={`rounded-xl border p-2.5 text-left transition-all cursor-pointer ${on ? `${TONES[o.tone].border} ${TONES[o.tone].bg} ring-1 ${TONES[o.tone].ring}` : 'border-slate-800 bg-slate-950/40 hover:border-slate-600'}`}>
                      <div className="text-[11px] leading-tight text-slate-400">{o.label}</div>
                      <div className={`font-mono-sci mt-1 text-lg font-bold ${o.val < 1 ? 'text-rose-300' : 'text-emerald-300'}`}>{fmt(o.val)}</div>
                      <div className="text-[10px] text-slate-600">FoS en t = 3.84</div>
                    </button>
                  );
                })}
              </div>
            </Card>

            {/* Atribución + escenarios */}
            <div className="space-y-3 lg:col-span-2">
              <Card tone="orange" className="p-4 sm:p-5">
                <div className="text-sm text-slate-400">Caída del FoS 2017 → 2021</div>
                <div className="mt-1 flex items-baseline gap-2">
                  <span className="font-mono-sci text-2xl font-bold text-slate-50">{fmt(termCohesion(C_PICO) + termFriccion(PHI_PICO))}</span>
                  <Icon name="ArrowRight" size={16} className="text-slate-500" />
                  <span className="font-mono-sci text-2xl font-bold text-rose-300">{fmt(termCohesion(C_RESIDUAL) + termFriccion(PHI_RESIDUAL))}</span>
                  <span className="font-mono-sci text-sm text-slate-500">(Δ {fmt(dTot)})</span>
                </div>
                <div className="mt-4 flex h-10 w-full overflow-hidden rounded-lg">
                  <div className="anim-grow flex items-center justify-center text-sm font-bold text-slate-950" style={{ width: `${shareF}%`, background: TONES.orange.hex }}>{shareF} %</div>
                  <div className="anim-grow flex items-center justify-center text-xs font-bold text-slate-950" style={{ width: `${shareC}%`, background: TONES.blue.hex, animationDelay: '.2s' }}>{shareC} %</div>
                </div>
                <div className="mt-2 flex justify-between text-xs text-slate-400">
                  <span>Fricción 30.8° → 21.3° <b className="text-orange-300">({fmt(dF)})</b></span>
                  <span>Cohesión <b className="text-sky-300">({fmt(dC)})</b></span>
                </div>
              </Card>

              <Card className="p-4 sm:p-5">
                <div className="mb-3 text-xs font-semibold uppercase tracking-widest text-slate-500">Dos escenarios fijos de φ</div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="rounded-xl border border-orange-300/30 bg-orange-300/10 p-3">
                    <div className="text-xs text-slate-400">Pico</div>
                    <div className="font-mono-sci text-2xl font-bold text-orange-300">30.8°</div>
                    <div className="text-[11px] text-slate-500">antes de la falla</div>
                  </div>
                  <div className="rounded-xl border border-sky-400/30 bg-sky-400/10 p-3">
                    <div className="text-xs text-slate-400">Residual</div>
                    <div className="font-mono-sci text-2xl font-bold text-sky-300">21.3°</div>
                    <div className="text-[11px] text-slate-500">después de la falla</div>
                  </div>
                </div>
                <ul className="mt-3 space-y-2">
                  <Bullet icon="Check" tone="green">Solo c es aleatoria: φ entra como rango fijo, sin ajustar una trayectoria que los datos no identifican.</Bullet>
                  <Bullet icon="Check" tone="green">+10 % en φ ⇒ <b className="text-slate-100">+10.5 %</b> FoS; +10 % en c ⇒ solo <b className="text-slate-100">+1.3 %</b>.</Bullet>
                </ul>
              </Card>
              <p className="px-1 text-[11px] leading-snug text-slate-600">Deslizador: interpolación lineal entre las dos mediciones reales. β = 30°, z = 13 m, γ = 19.01 kN/m³; el nivel absoluto del FoS no está calibrado: úsese para tendencias.</p>
            </div>
          </div>
        </SlideShell>
      );
    };

    /* ---------- 09 · Arquitectura (Step Reveal) ---------- */
    const FLOORS = [
      {
        id: 1, tone: 'blue', icon: 'Dna', name: 'Piso 1 · ADN regional', short: 'Tasas compartidas · Lognormal',
        eq: ['μ_α      ~ Normal(15, 10)', 'σ_α      ~ HalfNormal(5)', 'δ_región ~ LogNormal(ln 1, 0.75)'],
        points: [
          'Define la región antes de mirar ningún talud.',
          'δ_región > 0: el talud pierde cohesión, no la gana.',
          'Mediana a priori 1 kPa/año; 94 % en [0.24, 4.1].',
          'Priors débiles que no usan Cortinas: sin doble conteo.',
        ],
        code: null,
      },
      {
        id: 2, tone: 'indigo', icon: 'MapPin', name: 'Piso 2 · Efecto local', short: 'No centrada · Sitio_idx',
        eq: ['z_i ~ Normal(0, 1)', 'α_i = μ_α + σ_α · z_i      i = 0…26'],
        points: [
          'Cada talud tiene su cohesión inicial αᵢ, atada a la media regional.',
          'No centrada: desacopla la escala σ_α y evita divergencias (muchos sitios con 1–2 datos).',
          'Sitio_idx (0…26) asigna a cada fila su αᵢ.',
        ],
        code: 'mu_c = alpha_sitio[Sitio_idx] - delta_region * t',
      },
      {
        id: 3, tone: 'orange', icon: 'Atom', name: 'Piso 3 · Verosimilitud física', short: 'Normal truncada en 0',
        eq: ['μ_c,i(t) = α_i − δ_región · t', 'σ_obs ~ HalfNormal(5)', 'c_obs ~ TruncatedNormal(μ_c,i(t), σ_obs, lower = 0)'],
        points: [
          'Recta de deterioro: pendiente común, intercepto propio.',
          'La cohesión nunca puede ser negativa.',
          'Solo c es aleatoria; el FoS se evalúa con φ fija (pico / residual).',
        ],
        code: null,
      },
    ];

    const SlideArquitectura = () => {
      const [level, setLevel] = useState(1);
      const f = FLOORS[level - 1];
      const t = TONES[f.tone];
      return (
        <SlideShell n={9} kicker="Arquitectura del modelo" title="Tres pisos: de la región al dato"
          sub="Revela cada nivel de la jerarquía, de la cimentación hacia arriba.">
          <div className="grid gap-5 lg:grid-cols-5">
            {/* Edificio */}
            <div className="lg:col-span-2">
              <div className="flex flex-col gap-2.5">
                {[...FLOORS].reverse().map((fl) => {
                  const revealed = fl.id <= level;
                  const current = fl.id === level;
                  const tn = TONES[fl.tone];
                  return (
                    <button key={fl.id} onClick={() => setLevel(fl.id)} aria-label={fl.name}
                      className={`flex items-center gap-3 rounded-2xl border p-4 text-left transition-all duration-500 cursor-pointer ${
                        revealed ? `${tn.border} ${tn.bg}` : 'border-dashed border-slate-800 bg-slate-950/40 opacity-60'
                      } ${current ? `ring-2 ${tn.ring}` : ''}`}
                      style={{ marginLeft: `${(3 - fl.id) * 0}px` }}>
                      <span className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${revealed ? `${tn.bg} ${tn.text}` : 'bg-slate-800/50 text-slate-600'}`}>
                        <Icon name={revealed ? fl.icon : 'Lock'} size={20} />
                      </span>
                      <span className="min-w-0">
                        <span className={`block text-sm font-semibold ${revealed ? tn.text : 'text-slate-600'}`}>{revealed ? fl.name : `Piso ${fl.id} · ???`}</span>
                        <span className="block truncate text-xs text-slate-500">{revealed ? fl.short : 'Aún oculto'}</span>
                      </span>
                    </button>
                  );
                })}
                <div className="flex items-center gap-2 rounded-xl border border-dashed border-slate-800 px-4 py-2 text-xs text-slate-500">
                  <Icon name="Database" size={14} /> 48 observaciones c_obs · 27 sitios
                </div>
              </div>
              <div className="mt-4 flex items-center gap-2">
                <button onClick={() => setLevel((l) => Math.max(1, l - 1))} disabled={level === 1}
                  className="flex items-center gap-1.5 rounded-lg border border-slate-700 px-3 py-1.5 text-sm text-slate-300 transition hover:border-slate-500 disabled:cursor-not-allowed disabled:opacity-30 cursor-pointer">
                  <Icon name="ChevronUp" size={14} /> Ocultar
                </button>
                <button onClick={() => setLevel((l) => Math.min(3, l + 1))} disabled={level === 3}
                  className="flex items-center gap-1.5 rounded-lg border border-sky-400/40 bg-sky-400/10 px-3 py-1.5 text-sm text-sky-200 transition hover:bg-sky-400/20 disabled:cursor-not-allowed disabled:opacity-30 cursor-pointer">
                  <Icon name="Eye" size={14} /> Revelar siguiente
                </button>
                <button onClick={() => setLevel(1)} aria-label="Reiniciar" className="ml-auto text-slate-500 hover:text-slate-300 cursor-pointer"><Icon name="RotateCcw" size={16} /></button>
              </div>
            </div>

            {/* Detalle */}
            <Card key={f.id} tone={f.tone} className="anim-fade-up p-5 sm:p-6 lg:col-span-3">
              <div className="flex items-center gap-3">
                <span className={`flex h-11 w-11 items-center justify-center rounded-xl ${t.bg} ${t.text}`}><Icon name={f.icon} size={22} /></span>
                <div>
                  <div className={`text-xs font-semibold uppercase tracking-widest ${t.text}`}>{f.short}</div>
                  <div className="text-xl font-bold text-slate-50">{f.name}</div>
                </div>
              </div>
              <Eq tone={f.tone} className="mt-4 whitespace-pre">{f.eq.join('\n')}</Eq>
              <ul className="mt-4 space-y-2.5">
                {f.points.map((pt) => <Bullet key={pt} icon="Check" tone={f.tone}>{pt}</Bullet>)}
              </ul>
              {f.code && (
                <div className="mt-4 rounded-xl border border-slate-800 bg-slate-950/80 px-4 py-3">
                  <div className="mb-1 flex items-center gap-1.5 text-[11px] uppercase tracking-widest text-slate-500"><Icon name="Terminal" size={12} /> PyMC</div>
                  <code className="font-mono-sci text-[13px] text-emerald-300">{f.code}</code>
                </div>
              )}
              {f.id === 3 && (
                <div className="mt-4 flex flex-wrap gap-2">
                  <Chip tone="green" icon="CheckCircle2">Modelo completo</Chip>
                  <Chip tone="gray">NUTS · PyMC v5</Chip>
                </div>
              )}
            </Card>
          </div>
        </SlideShell>
      );
    };

    /* ---------- 10 · Inferencia y plan ---------- */
    const SlideInferencia = () => (
      <SlideShell n={10} kicker="Plan de inferencia" title="Corrida preliminar limpia; la crítica del modelo apenas empieza"
        sub="Diagnóstico exploratorio con NUTS: todavía no se reportan posteriores formales.">
        <div className="grid gap-5 lg:grid-cols-5">
          <div className="lg:col-span-2">
            <div className="grid grid-cols-2 gap-3">
              <Stat value="4×3000" label="cadenas × muestras" sub="2 000 de calentamiento" tone="blue" />
              <Stat value="1.00" label="R̂ en todos los parámetros" tone="green" />
              <Stat value="> 2800" label="ESS mínimo" tone="indigo" />
              <Stat value="0" label="divergencias" sub="gracias a la no centrada" tone="orange" />
            </div>
            <Card className="mt-3 p-4 text-sm text-slate-400">
              <div className="flex items-center gap-2 text-slate-200"><Icon name="Cpu" size={16} /> PyMC v5 · NUTS · ArviZ · semilla fija</div>
            </Card>
          </div>

          <div className="space-y-3 lg:col-span-3">
            <Card className="p-5">
              <div className="mb-3 text-xs font-semibold uppercase tracking-widest text-slate-500">Estado del cronograma (7 semanas)</div>
              <ul className="space-y-2.5">
                {[
                  { done: true, t: 'Sem. 1–2', d: 'Formulación, extracción de datos, modelo físico' },
                  { done: true, t: 'Sem. 3–4', d: 'Implementación en PyMC y MCMC preliminar' },
                  { done: false, t: 'Sem. 5', d: 'Chequeo predictivo posterior' },
                  { done: false, t: 'Sem. 6', d: 'Contracción posterior/prior y validación hacia adelante' },
                  { done: false, t: 'Sem. 7', d: 'Dashboard P(FoS ≤ 1) e informe final' },
                ].map((s) => (
                  <li key={s.t} className="flex items-start gap-3">
                    <span className={`mt-0.5 ${s.done ? 'text-emerald-300' : 'text-slate-600'}`}><Icon name={s.done ? 'CheckCircle2' : 'Circle'} size={18} /></span>
                    <span className="text-sm text-slate-300"><b className={s.done ? 'text-slate-100' : 'text-slate-400'}>{s.t}</b> · {s.d}</span>
                  </li>
                ))}
              </ul>
            </Card>
            <Card tone="orange" className="p-5">
              <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-orange-300"><Icon name="GitBranch" size={16} /> Modelos rivales a comparar</div>
              <div className="grid gap-2 sm:grid-cols-2">
                {['Sin jerarquía (αᵢ única)', 'Normal sin truncar', 'Student-t (colas pesadas)', 'Avance 1 (solo Cortinas)'].map((m) => (
                  <div key={m} className="rounded-lg border border-slate-800 bg-slate-950/50 px-3 py-2 text-sm text-slate-300">{m}</div>
                ))}
              </div>
              <p className="mt-3 text-xs text-slate-500">Criterio: capacidad de predecir las dos mediciones de validación de Cortinas.</p>
            </Card>
          </div>
        </div>
      </SlideShell>
    );

    /* ---------- 11 · Jaque Mate ---------- */
    // Curvas leídas de la corrida preliminar (agd_cortinas_jaque_mate.png). Son ilustrativas, no inferencia nueva.
    const MEAN_LINE = (t) => Math.max(0, 17.5 - 1.35 * t);
    const CONE_UP = (t) => 23.5 - 1.25 * t;
    const CONE_LO = (t) => Math.max(0, 11.3 - 1.8 * t);
    const BAND_UP_PTS = [[0, 28.2], [1, 26.5], [2, 24.8], [3, 23], [4, 21], [5, 18.8], [6, 17.6], [7, 17.0], [8, 16.8]];
    const BAND_LO_PTS = [[0, 6.4], [1, 4.8], [2, 3.2], [3, 2.2], [4, 1.4], [5, 0.6], [6, 0], [8, 0]];
    const BAND_UP = (t) => interp(BAND_UP_PTS, t);
    const BAND_LO = (t) => interp(BAND_LO_PTS, t);
    const PHI_MEDIA = (PHI_PICO + PHI_RESIDUAL) / 2;   // fricción fija de la figura (≈ 26.05°)
    const FOS_OF_C = (c) => termCohesion(c) + termFriccion(PHI_MEDIA);

    const TRAIN_PTS = [{ t: 0, c: 18.5 }, { t: 3.84, c: 12.1 }];
    const VAL_PTS = [{ t: 5.84, c: 16.3 }, { t: 7.84, c: 17.2 }];

    const SlideJaque = () => {
      const [view, setView] = useState('c');
      const [layers, setLayers] = useState({ cone: true, band: true, mean: true, train: true });
      const [revealed, setRevealed] = useState(false);
      const toggleLayer = (k) => setLayers((s) => ({ ...s, [k]: !s[k] }));

      const W = 640, H = 350, m = { l: 54, r: 20, t: 16, b: 44 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const isC = view === 'c';
      const yMin = isC ? 0 : 0.8, yMax = isC ? 30 : 1.12;
      const tf = isC ? (c) => c : FOS_OF_C;
      const X = (t) => m.l + (t / 8) * iw;
      const Y = (c) => m.t + (1 - (tf(c) - yMin) / (yMax - yMin)) * ih;
      const ts = useMemo(() => Array.from({ length: 81 }, (_, i) => i / 10), []);
      const poly = (fn) => ts.map((t) => `${X(t).toFixed(1)},${Y(fn(t)).toFixed(1)}`).join(' ');
      const conePoly = `${poly(CONE_UP)} ${[...ts].reverse().map((t) => `${X(t).toFixed(1)},${Y(CONE_LO(t)).toFixed(1)}`).join(' ')}`;
      const yTicks = isC ? [0, 5, 10, 15, 20, 25, 30] : [0.8, 0.85, 0.9, 0.95, 1.0, 1.05, 1.1];

      const verdict = (pt) => {
        if (pt.c > BAND_UP(pt.t)) return { txt: 'por encima de la banda predictiva', tone: 'red' };
        if (pt.c >= CONE_UP(pt.t) - 0.2) return { txt: 'sobre el borde superior del cono', tone: 'orange' };
        return { txt: 'dentro del cono', tone: 'green' };
      };

      const LayerBtn = ({ k, label, color }) => (
        <button onClick={() => toggleLayer(k)}
          className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1 text-xs transition cursor-pointer ${layers[k] ? 'border-slate-600 bg-slate-800/70 text-slate-200' : 'border-slate-800 text-slate-600'}`}>
          <span className="h-2.5 w-2.5 rounded-sm" style={{ background: layers[k] ? color : '#334155' }} /> {label}
        </button>
      );

      return (
        <SlideShell n={11} kicker="Validación fuera de muestra" title="Jaque mate: la realidad contradice la recta"
          sub="Cortinas después del colapso (t = 3.84): lo que predice el modelo vs. lo que se midió.">
          <div className="grid gap-4 lg:grid-cols-5">
            <Card className="p-3 sm:p-4 lg:col-span-3">
              <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
                <SegTabs value={view} onChange={setView}
                  options={[{ id: 'c', label: 'Cohesión (kPa)', icon: 'Activity' }, { id: 'fos', label: 'FoS', icon: 'Scale' }]} />
                <button onClick={() => setRevealed((r) => !r)}
                  className={`flex items-center gap-2 rounded-lg border px-3 py-1.5 text-sm font-semibold transition cursor-pointer ${revealed ? 'border-slate-700 text-slate-300 hover:border-slate-500' : 'border-rose-400/50 bg-rose-400/15 text-rose-200 hover:bg-rose-400/25'}`}>
                  <Icon name={revealed ? 'EyeOff' : 'Eye'} size={15} /> {revealed ? 'Ocultar validación' : 'Revelar validación'}
                </button>
              </div>

              <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Cono de degradación del modelo contra los puntos de validación de Cortinas">
                {/* grilla */}
                {yTicks.map((v) => {
                  const yy = m.t + (1 - (v - yMin) / (yMax - yMin)) * ih;
                  return (
                    <g key={v}>
                      <line x1={m.l} x2={W - m.r} y1={yy} y2={yy} stroke="#1e293b" />
                      <text x={m.l - 8} y={yy + 4} textAnchor="end" fontSize="12" fill="#64748b">{isC ? v : v.toFixed(2)}</text>
                    </g>
                  );
                })}
                {[0, 1, 2, 3, 4, 5, 6, 7, 8].map((v) => (
                  <g key={v}>
                    <line x1={X(v)} x2={X(v)} y1={m.t} y2={m.t + ih} stroke="#111a2c" />
                    <text x={X(v)} y={m.t + ih + 18} textAnchor="middle" fontSize="12" fill="#64748b">{v}</text>
                  </g>
                ))}
                <text x={m.l + iw / 2} y={H - 8} textAnchor="middle" fontSize="12" fill="#64748b">t (años desde 2017-03-01)</text>
                <text transform={`translate(14 ${m.t + ih / 2}) rotate(-90)`} textAnchor="middle" fontSize="12" fill="#64748b">{isC ? 'Cohesión c (kPa)' : 'FoS (φ fija ≈ 26.1°)'}</text>

                {!isC && (
                  <g>
                    <line x1={m.l} x2={W - m.r} y1={Y((1 - termFriccion(PHI_MEDIA)) * K_COH)} y2={Y((1 - termFriccion(PHI_MEDIA)) * K_COH)} stroke="#fb7185" strokeDasharray="6 5" />
                    <text x={m.l + 120} y={Y((1 - termFriccion(PHI_MEDIA)) * K_COH) - 6} textAnchor="start" fontSize="11" fill="#fb7185">FoS = 1</text>
                  </g>
                )}

                {/* banda predictiva */}
                {layers.band && (
                  <g>
                    <polyline points={poly(BAND_UP)} fill="none" stroke="#94a3b8" strokeDasharray="5 5" strokeWidth="1.3" />
                    <polyline points={poly(BAND_LO)} fill="none" stroke="#94a3b8" strokeDasharray="5 5" strokeWidth="1.3" />
                  </g>
                )}
                {/* cono HDI */}
                {layers.cone && <polygon points={conePoly} fill="#fdba74" fillOpacity="0.25" stroke="#fdba74" strokeOpacity="0.35" />}
                {/* media */}
                {layers.mean && <polyline points={poly(MEAN_LINE)} fill="none" stroke="#fdba74" strokeWidth="3" strokeLinecap="round" />}

                {/* colapso */}
                <line x1={X(3.84)} x2={X(3.84)} y1={m.t} y2={m.t + ih} stroke="#cbd5e1" strokeDasharray="2 4" />
                <text x={X(3.84) + 6} y={m.t + 14} fontSize="11" fill="#cbd5e1">colapso t = 3.84</text>

                {/* entrenamiento */}
                {layers.train && TRAIN_PTS.map((p) => (
                  <circle key={p.t} cx={X(p.t)} cy={Y(p.c)} r="7" fill="#38bdf8" stroke="#0b1220" strokeWidth="2" />
                ))}

                {/* validación */}
                {revealed && VAL_PTS.map((p, i) => (
                  <g key={p.t}>
                    <g className="pulse-ring"><circle cx={X(p.t)} cy={Y(p.c)} r="9" fill="none" stroke="#fb7185" strokeWidth="2" /></g>
                    <g className="anim-pop" style={{ animationDelay: `${i * 0.35}s` }}>
                      <rect x={X(p.t) - 8} y={Y(p.c) - 8} width="16" height="16" fill="#fb7185" stroke="#0b1220" strokeWidth="2" transform={`rotate(45 ${X(p.t)} ${Y(p.c)})`} />
                    </g>
                    <text x={X(p.t)} y={Y(p.c) - 16} textAnchor="middle" fontSize="12" fontWeight="700" fill="#fda4af">t = {p.t}</text>
                  </g>
                ))}
              </svg>

              <div className="mt-2 flex flex-wrap gap-2">
                <LayerBtn k="cone" label="Cono HDI 94 %" color="#fdba74" />
                <LayerBtn k="band" label="Banda predictiva" color="#94a3b8" />
                <LayerBtn k="mean" label="Media AGD lineal" color="#fdba74" />
                <LayerBtn k="train" label="Entrenamiento" color="#38bdf8" />
              </div>
            </Card>

            <div className="space-y-3 lg:col-span-2">
              {VAL_PTS.map((p) => {
                const pred = MEAN_LINE(p.t);
                const v = verdict(p);
                const show = revealed;
                const val = isC ? p.c : FOS_OF_C(p.c);
                const pr = isC ? pred : FOS_OF_C(pred);
                const dlt = val - pr;
                return (
                  <Card key={p.t} tone={show ? v.tone : 'gray'} className="p-4 transition-all">
                    <div className="flex items-center justify-between">
                      <span className="font-mono-sci text-sm text-slate-400">t = {p.t} años</span>
                      {show ? <Chip tone={v.tone} icon="AlertTriangle">{v.txt}</Chip> : <Chip tone="gray" icon="Lock">oculto</Chip>}
                    </div>
                    <div className="mt-3 grid grid-cols-3 gap-2 text-center">
                      <div><div className="text-[11px] text-slate-500">Modelo (media)</div><div className="font-mono-sci text-xl font-bold text-orange-300">{fmt(pr, isC ? 1 : 3)}</div></div>
                      <div><div className="text-[11px] text-slate-500">Medido</div><div className="font-mono-sci text-xl font-bold text-rose-300">{show ? fmt(val, isC ? 1 : 3) : '—'}</div></div>
                      <div><div className="text-[11px] text-slate-500">Diferencia</div><div className="font-mono-sci text-xl font-bold text-slate-100">{show ? `+${fmt(dlt, isC ? 1 : 3)}` : '—'}</div></div>
                    </div>
                  </Card>
                );
              })}

              <Card tone="orange" className="p-4">
                <ul className="space-y-2.5">
                  <Bullet icon="TrendingDown" tone="orange">Modelo: caída monótona (≈ 12 → 9.6 → 6.9 kPa).</Bullet>
                  <Bullet icon="TrendingUp" tone="red">Realidad: 12.1 → <b className="text-slate-100">16.3 → 17.2 kPa</b>. La cohesión sube.</Bullet>
                  <Bullet icon="Droplets" tone="blue">Hipótesis: recuperación de resistencia (p. ej. succión), que una recta decreciente no representa.</Bullet>
                </ul>
              </Card>
              <p className="px-1 text-[11px] leading-snug text-slate-600">Curvas leídas de la corrida preliminar (AGD lineal, α₀ de Cortinas y δ regional); valores aproximados. Conclusión pendiente de chequeos predictivos y comparación de modelos.</p>
            </div>
          </div>
        </SlideShell>
      );
    };

    /* ---------- 12 · Cierre ---------- */
    const SlideCierre = () => (
      <SlideShell n={12} kicker="Conclusiones" title="Un modelo que aprende de la región… y se deja contradecir por los datos">
        <div className="grid gap-4 lg:grid-cols-3">
          <Card tone="blue" className="p-5">
            <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-sky-300"><Icon name="Sparkles" size={17} /> Aportes</div>
            <ul className="space-y-3">
              <Bullet icon="Network" tone="blue">Tasa regional δ desde una serie de tiempo mínima, separando lo estimado de lo extrapolado.</Bullet>
              <Bullet icon="Scale" tone="blue">Cohesión → P(FoS &lt; 1) con escenarios de fricción pico y residual.</Bullet>
              <Bullet icon="ShieldCheck" tone="blue">Contraste out-of-sample con Cortinas post-falla.</Bullet>
            </ul>
          </Card>
          <Card tone="orange" className="p-5">
            <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-orange-300"><Icon name="AlertTriangle" size={17} /> Limitaciones</div>
            <ul className="space-y-3">
              <Bullet icon="Minus" tone="orange">δ informada por una sola caída (Cortinas).</Bullet>
              <Bullet icon="Minus" tone="orange">Supone Cortinas representativo de la región.</Bullet>
              <Bullet icon="Minus" tone="orange">FoS sensible a β y z; nivel absoluto no calibrado.</Bullet>
              <Bullet icon="Minus" tone="orange">3 ceros de origen SPT por verificar.</Bullet>
            </ul>
          </Card>
          <Card tone="green" className="p-5">
            <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-emerald-300"><Icon name="Flag" size={17} /> Siguiente vuelta</div>
            <ul className="space-y-3">
              <Bullet icon="ChevronRight" tone="green">Prior predictive checks sobre los hiper-priors.</Bullet>
              <Bullet icon="ChevronRight" tone="green">Sensibilidad a la prior de δ_región.</Bullet>
              <Bullet icon="ChevronRight" tone="green">Comparar: sin jerarquía · Normal · Student-t.</Bullet>
              <Bullet icon="ChevronRight" tone="green">Contracción posterior/prior y dashboard P(FoS ≤ 1).</Bullet>
            </ul>
          </Card>
        </div>

        <div className="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4">
          <Stat value="48" label="observaciones" tone="blue" />
          <Stat value="27" label="taludes" tone="indigo" />
          <Stat value="86 %" label="caída FoS por fricción" tone="orange" />
          <Stat value="2" label="puntos que cuestionan la recta" tone="red" />
        </div>

        <div className="mt-6 flex items-center justify-center gap-2 text-center text-sm text-slate-500">
          <Icon name="Repeat" size={15} /> Proponer · ajustar · criticar · replantear — el ciclo de Box continúa.
        </div>
      </SlideShell>
    );

    /* =====================================================================
     * 3. REGISTRO DE DIAPOSITIVAS Y CARRUSEL
     * ===================================================================== */
    const SLIDES = [
      { id: 'portada', title: 'Portada', Comp: SlideCover },
      { id: 'problema', title: 'El problema', Comp: SlideProblema },
      { id: 'box', title: 'Ciclo de Box', Comp: SlideBox },
      { id: 'datos', title: 'Datos', Comp: SlideDatos },
      { id: 'small', title: 'Small Data', Comp: SlideSmallData },
      { id: 'salto', title: 'Salto metodológico', Comp: SlideSalto },
      { id: 'truncada', title: 'Normal truncada', Comp: SlideTruncada },
      { id: 'fos', title: 'Sensibilidad FoS', Comp: SlideFoS },
      { id: 'arq', title: 'Arquitectura', Comp: SlideArquitectura },
      { id: 'inf', title: 'Inferencia', Comp: SlideInferencia },
      { id: 'jaque', title: 'Jaque mate', Comp: SlideJaque },
      { id: 'cierre', title: 'Conclusiones', Comp: SlideCierre },
    ];

    function App() {
      const total = SLIDES.length;
      // Permite abrir una diapositiva concreta con presentacion.html#5
      const [state, setState] = useState(() => {
        const n = parseInt(window.location.hash.replace('#', ''), 10);
        return { current: Number.isFinite(n) ? clamp(n - 1, 0, total - 1) : 0, dir: 1 };
      });
      const { current, dir } = state;
      useEffect(() => { window.history.replaceState(null, '', `#${current + 1}`); }, [current]);
      const mainRef = useRef(null);
      const touch = useRef(null);

      const go = useCallback((n) => {
        setState((s) => {
          const next = clamp(n, 0, total - 1);
          return next === s.current ? s : { current: next, dir: next > s.current ? 1 : -1 };
        });
      }, [total]);
      const next = useCallback(() => setState((s) => (s.current < total - 1 ? { current: s.current + 1, dir: 1 } : s)), [total]);
      const prev = useCallback(() => setState((s) => (s.current > 0 ? { current: s.current - 1, dir: -1 } : s)), []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
          if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
          else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
          else if (e.key === 'Home') go(0);
          else if (e.key === 'End') go(total - 1);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [next, prev, go, total]);

      useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [current]);

      const onTouchStart = (e) => {
        if (e.target.closest && e.target.closest('input[type=range]')) { touch.current = null; return; }
        const t = e.touches[0];
        touch.current = { x: t.clientX, y: t.clientY };
      };
      const onTouchEnd = (e) => {
        if (!touch.current) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touch.current.x;
        const dy = t.clientY - touch.current.y;
        touch.current = null;
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? next : prev)();
      };

      const { Comp } = SLIDES[current];
      const progress = ((current + 1) / total) * 100;

      return (
        <div className="relative flex h-dvh flex-col bg-[#070b14]" style={{ backgroundImage: 'radial-gradient(1200px 500px at 85% -10%, rgba(56,189,248,.10), transparent), radial-gradient(900px 500px at -10% 110%, rgba(253,186,116,.08), transparent)' }}>
          {/* Barra superior */}
          <header className="flex shrink-0 items-center justify-between gap-3 border-b border-slate-800/80 px-4 py-2.5 sm:px-8">
            <div className="flex min-w-0 items-center gap-2.5">
              <span className="flex h-7 w-7 items-center justify-center rounded-lg bg-sky-400/15 text-sky-300"><Icon name="Mountain" size={16} /></span>
              <span className="truncate text-sm font-semibold text-slate-200">AGD-Sentinel V2</span>
              <span className="hidden text-slate-700 sm:inline">/</span>
              <span className="hidden truncate text-sm text-slate-500 sm:inline">{SLIDES[current].title}</span>
            </div>
            <span className="font-mono-sci text-xs text-slate-500">{String(current + 1).padStart(2, '0')} / {total}</span>
          </header>
          <div className="h-0.5 w-full shrink-0 bg-slate-900">
            <div className="h-full bg-gradient-to-r from-sky-400 to-orange-300 transition-all duration-500" style={{ width: `${progress}%` }} />
          </div>

          {/* Área de diapositiva */}
          <main ref={mainRef} className="thin-scroll min-h-0 flex-1 overflow-y-auto overflow-x-hidden" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
            <div key={current} className={`min-h-full ${dir > 0 ? 'anim-in-right' : 'anim-in-left'}`}>
              <Comp />
            </div>
          </main>

          {/* Navegación */}
          <footer className="flex shrink-0 items-center justify-between gap-3 border-t border-slate-800/80 bg-slate-950/70 px-3 py-2.5 backdrop-blur sm:px-8">
            <button onClick={prev} disabled={current === 0} aria-label="Diapositiva anterior"
              className="flex items-center gap-1.5 rounded-xl border border-slate-700 px-3 py-2 text-sm font-medium text-slate-200 transition hover:border-slate-500 hover:bg-slate-800/60 disabled:cursor-not-allowed disabled:opacity-30 cursor-pointer">
              <Icon name="ChevronLeft" size={18} /> <span className="hidden sm:inline">Anterior</span>
            </button>

            <nav className="flex min-w-0 flex-1 items-center justify-center gap-1.5 sm:gap-2" aria-label="Diapositivas">
              {SLIDES.map((s, i) => (
                <button key={s.id} onClick={() => go(i)} aria-label={`Ir a ${s.title}`} aria-current={i === current ? 'true' : undefined}
                  className={`h-2 rounded-full transition-all cursor-pointer ${i === current ? 'w-6 bg-orange-300' : i < current ? 'w-2 bg-sky-400/60 hover:bg-sky-300' : 'w-2 bg-slate-700 hover:bg-slate-500'}`} />
              ))}
            </nav>

            <button onClick={next} disabled={current === total - 1} aria-label="Diapositiva siguiente"
              className="flex items-center gap-1.5 rounded-xl border border-sky-400/40 bg-sky-400/15 px-3 py-2 text-sm font-medium text-sky-100 transition hover:bg-sky-400/25 disabled:cursor-not-allowed disabled:opacity-30 cursor-pointer">
              <span className="hidden sm:inline">Siguiente</span> <Icon name="ChevronRight" size={18} />
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
